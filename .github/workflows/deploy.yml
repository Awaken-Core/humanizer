name: Deploy Humanizer to GCP VM

on:
    push:
        branches: [release/prod]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: humanizer-production
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        env:
            GCP_HOST: ${{ secrets.GCP_HOST }}
            SSH_PORT: ${{ secrets.SSH_PORT }}
            NEXT_PUBLIC_APP_BASE_URL: ${{ secrets.NEXT_PUBLIC_APP_BASE_URL }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: "22"

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.5"

            - name: Validate deployment settings
              shell: bash
              run: |
                  set -euo pipefail
                  test -n "$GCP_HOST" || { echo 'Set GCP_HOST'; exit 1; }
                  [[ "$GCP_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'GCP_HOST must be a hostname or IPv4 address'; exit 1; }
                  [[ "$SSH_PORT" =~ ^[0-9]+$ ]] || exit 1
                  node -e 'const value = process.env.NEXT_PUBLIC_APP_BASE_URL; const u = new URL(value); const temporaryIp = u.protocol === "http:" && require("node:net").isIP(u.hostname) === 4 && u.hostname === process.env.GCP_HOST && !u.port; if ((u.protocol !== "https:" && !temporaryIp) || u.origin !== value) throw new Error("Use an HTTPS origin or http://GCP_HOST for temporary IP access, without a trailing slash")'

            - run: bun install --frozen-lockfile
            - name: Build standalone application
              run: |
                  bun run build
                  cp -r apps/client/public apps/client/.next/standalone/apps/client/public
                  cp -r apps/client/.next/static apps/client/.next/standalone/apps/client/.next/static
                  tar -czf "$RUNNER_TEMP/humanizer.tgz" -C apps/client/.next/standalone .

            - name: Prepare runtime configuration
              env:
                  MONGODB_URI: ${{ secrets.MONGODB_URI }}
                  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
                  DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
                  DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
                  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
                  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
                  SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
                  SERPER_BASE_URL: ${{ secrets.SERPER_BASE_URL }}
              run: |
                  node <<'NODE'
                  const fs = require('node:fs');
                  const required = ['MONGODB_URI', 'BETTER_AUTH_SECRET', 'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'DEEPSEEK_API_KEY', 'UPSTASH_REDIS_REST_URL', 'UPSTASH_REDIS_REST_TOKEN', 'NEXT_PUBLIC_APP_BASE_URL'];
                  for (const key of required) if (!process.env[key]) throw new Error(`Missing GitHub secret: ${key}`);
                  const optional = ['DEEPSEEK_MODEL', 'DEEPSEEK_BASE_URL', 'SERPER_API_KEY', 'SERPER_BASE_URL', 'POSTHOG_PROJECT_ID', 'POSTHOG_API_KEY', 'NEXT_PUBLIC_GA_MEASUREMENT_ID', 'NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN', 'NEXT_PUBLIC_POSTHOG_HOST'];
                  const config = Object.fromEntries([...required, ...optional].filter(key => process.env[key]).map(key => [key, process.env[key]]));
                  config.NODE_ENV = 'production';
                  fs.writeFileSync(`${process.env.RUNNER_TEMP}/runtime.json`, JSON.stringify(config), { mode: 0o600 });
                  NODE

            - name: Configure SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.GCP_SSH_KNOWN_HOSTS }}
                  SSH_KEY_PASSPHRASE: ${{ secrets.GCP_SSH_PASSPHRASE }}
              run: |
                  set -euo pipefail
                  test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
                  install -d -m 700 ~/.ssh
                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
                  eval "$(ssh-agent -s)"
                  printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
                  cat > "$RUNNER_TEMP/ssh-askpass.sh" <<'ASKPASS'
                  #!/usr/bin/env bash
                  printf '%s\n' "$SSH_KEY_PASSPHRASE"
                  ASKPASS
                  chmod 700 "$RUNNER_TEMP/ssh-askpass.sh"
                  DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass.sh" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/id_ed25519" < /dev/null
                  rm -f "$RUNNER_TEMP/ssh-askpass.sh"

            - name: Upload and activate release
              env:
                  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
              run: |
                  set -euo pipefail
                  SSH_OPTIONS=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
                  remote="humarizer@$GCP_HOST"
                  ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$remote" "umask 077; mkdir -p /home/humarizer/apps/humanizer/incoming/$RELEASE_ID"
                  scp "${SSH_OPTIONS[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/humanizer.tgz" "$RUNNER_TEMP/runtime.json" deploy/activate-release.sh "$remote:/home/humarizer/apps/humanizer/incoming/$RELEASE_ID/"
                  ssh "${SSH_OPTIONS[@]}" -p "$SSH_PORT" "$remote" "bash /home/humarizer/apps/humanizer/incoming/$RELEASE_ID/activate-release.sh $RELEASE_ID"

            - name: Remove runner credentials
              if: always()
              run: |
                  if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null || true; fi
                  rm -f "$RUNNER_TEMP/runtime.json" "$RUNNER_TEMP/humanizer.tgz" "$RUNNER_TEMP/ssh-askpass.sh" "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
